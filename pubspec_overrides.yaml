# speech_fluidaudio compiles against the unreleased fluidaudio_dart 0.5.0
# surface (host-managed model roots). Everything else resolves hosted.
#
# Developer override only — release tooling copies packages out of the
# workspace, so releases are unaffected. Delete this file together with the
# CI sibling-clone step once fluidaudio_dart 0.5.0 is published and the
# adapter constraint resolves from pub.dev.
dependency_overrides:
  fluidaudio_dart:
    path: ../fluidaudio-dart
