# Local-development overrides for the sibling inference-engine repos.
#
# speech_fluidaudio pins `fluidaudio_dart: ^0.5.0` and speech_mlx pins
# `mlx_audio: ^0.2.0`. The local sibling checkouts carry the unreleased
# 0.5.0 / 0.2.1 surfaces (host-managed model roots, ModelKind expansion,
# batch vocabulary rescoring, timing-preserving ITN, hub revision pinning)
# that the adapter work compiles against.
#
# Developer override only — publish_dry_run.sh copies packages out of the
# workspace, so releases are unaffected. Delete once fluidaudio_dart 0.5.0 and
# mlx_audio 0.2.1 are published and the adapter constraints are bumped.
dependency_overrides:
  fluidaudio_dart:
    path: ../fluidaudio-dart
  mlx:
    path: ../mlx/packages/mlx
  mlx_audio:
    path: ../mlx/packages/mlx_audio
