name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: flutter-actions/setup-flutter@18c66a64fb6f6d3338c63cabbc5cd6da395e7f1d
        with:
          version: 3.44.0
          channel: stable
          cache: true
          cache-sdk: true
      - name: Verify workspace
        run: ./tool/verify.sh
      - name: Validate publish archives
        run: ./tool/publish_dry_run.sh
