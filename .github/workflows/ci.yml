name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: flutter-actions/setup-flutter@18c66a64fb6f6d3338c63cabbc5cd6da395e7f1d
        with:
          version: 3.44.0
          channel: stable
          cache: true
          cache-sdk: true
      - name: Verify workspace
        run: ./tool/verify.sh
      - name: Validate publish archives
        run: ./tool/publish_dry_run.sh
