name: Release preflight

on:
  workflow_call:
    inputs:
      package:
        required: true
        type: string
      working-directory:
        required: true
        type: string

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: flutter-actions/setup-flutter@18c66a64fb6f6d3338c63cabbc5cd6da395e7f1d
        with:
          version: 3.44.0
          channel: stable
          cache: true
          cache-sdk: true
      - name: Validate tag, archive, and hosted dependencies
        run: >-
          ./tool/release_check.sh
          '${{ inputs.package }}'
          '${{ inputs.working-directory }}'
