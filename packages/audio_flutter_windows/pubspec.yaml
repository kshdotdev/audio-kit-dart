name: audio_flutter_windows
description: Windows implementation of audio_flutter - WASAPI loopback and microphone capture plus render playback.
version: 0.1.0
resolution: workspace
homepage: https://github.com/kshdotdev/audio-kit-dart
repository: https://github.com/kshdotdev/audio-kit-dart
issue_tracker: https://github.com/kshdotdev/audio-kit-dart/issues
topics:
  - audio
  - windows
  - wasapi
platforms:
  windows:

environment:
  sdk: ^3.12.0
  flutter: '>=3.44.0'

flutter:
  plugin:
    implements: audio_flutter
    platforms:
      windows:
        pluginClass: AudioFlutterWindowsPluginCApi
        dartPluginClass: AudioFlutterWindows

dependencies:
  audio_core: ^0.1.0
  audio_flutter_platform_interface: ^0.2.0
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
